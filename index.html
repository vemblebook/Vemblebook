
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VembleBook</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f2f5;font-family:Arial,sans-serif;color:#222}
header{background:#1877f2;color:white;padding:18px;font-size:27px;font-weight:bold}
main{max-width:430px;margin:35px auto;padding:15px}
.card{background:white;padding:24px;border-radius:14px;box-shadow:0 2px 10px #ddd}
h2{text-align:center;color:#1877f2}
p{text-align:center}
input{width:100%;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:7px;font-size:15px}
button{width:100%;padding:13px;margin-top:12px;border:0;border-radius:7px;background:#1877f2;color:white;font-size:16px}
.green{background:#42b72a}
.link{text-align:center;color:#1877f2;margin-top:18px;cursor:pointer}
.hidden{display:none}
#message{padding:12px;overflow-wrap:anywhere;text-align:center}
</style>
</head>
<body>
<header>VembleBook</header>
<main>

<div class="card" id="home">
<h2>Welcome to VembleBook!</h2>
<p>বিশ্বের মানুষের সঙ্গে যুক্ত হোন।</p>
<button onclick="show('signup')">Get Started</button>
<button class="green" onclick="show('login')">Login</button>
</div>

<div class="card hidden" id="signup">
<h2>Create Account</h2>
<p>নতুন অ্যাকাউন্ট খুলুন</p>
<input id="name" placeholder="আপনার নাম">
<input id="phone" type="tel" placeholder="ফোন নম্বর">
<input id="email" type="email" placeholder="ইমেইল">
<input id="password" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)">
<button onclick="signup()">Sign Up</button>
<div class="link" onclick="show('login')">আগে অ্যাকাউন্ট আছে? Login</div>
<div class="link" onclick="show('home')">Home</div>
</div>

<div class="card hidden" id="login">
<h2>Login</h2>
<p>আপনার অ্যাকাউন্টে প্রবেশ করুন</p>
<input id="loginEmail" type="email" placeholder="ইমেইল">
<input id="loginPassword" type="password" placeholder="পাসওয়ার্ড">
<button onclick="login()">Login</button>
<div class="link" onclick="show('signup')">নতুন অ্যাকাউন্ট খুলুন</div>
<div class="link" onclick="show('home')">Home</div>
</div>

<div class="card hidden" id="account">
<h2>VembleBook</h2>
<p id="welcome"></p>
<button onclick="logout()">Logout</button>
</div>

<div id="message"></div>
</main>

<script>
const SUPABASE_URL = "https://perycpyohnpzhggzsapg.supabase.co";
const SUPABASE_KEY = "sb_publishable_tuvNW6DpJen3sFauJBj98Q_5S6x7Yi9";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function show(page){
  document.querySelectorAll('.card').forEach(c=>c.classList.add('hidden'));
  document.getElementById(page).classList.remove('hidden');
  document.getElementById('message').textContent='';
}

function say(text){
  document.getElementById('message').textContent=text;
}

async function signup(){
  const name=document.getElementById('name').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;

  if(!name || !phone || !email || !password){
    say('সব ঘর পূরণ করুন।');
    return;
  }
  if(password.length<6){
    say('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।');
    return;
  }

  say('অ্যাকাউন্ট তৈরি হচ্ছে...');

  const {error}=await client.auth.signUp({
    email,
    password,
    options:{
      emailRedirectTo:window.location.origin+window.location.pathname,
      data:{full_name:name,phone:phone}
    }
  });

  if(error){
    say('সমস্যা: '+error.message);
    return;
  }

  say('নিবন্ধন সফল! ইমেইলে পাঠানো নিশ্চিতকরণ লিংকে চাপ দিন।');
}

async function login(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;

  if(!email || !password){
    say('ইমেইল ও পাসওয়ার্ড দিন।');
    return;
  }

  say('লগইন হচ্ছে...');

  const {data,error}=await client.auth.signInWithPassword({
    email,password
  });

  if(error){
    say('সমস্যা: '+error.message);
    return;
  }

  show('account');
  document.getElementById('welcome').textContent=
    'স্বাগতম, '+(data.user.user_metadata.full_name || data.user.email);
}

async function logout(){
  const {error}=await client.auth.signOut();
  if(error){say(error.message);return;}
  show('home');
  say('আপনি লগআউট করেছেন।');
}

async function checkUser(){
  const {data}=await client.auth.getSession();
  if(data.session){
    show('account');
    document.getElementById('welcome').textContent=
      'স্বাগতম, '+(data.session.user.user_metadata.full_name || data.session.user.email);
  }
}
checkUser();
</script>
</body>
</html>
